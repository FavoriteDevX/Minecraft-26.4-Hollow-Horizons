name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Recursos JSON gerados estão atualizados
        run: |
          python3 tools/generate_data.py
          git diff --exit-code -- src/main/resources

      - name: Compilar e gerar o jar
        run: ./gradlew build --no-daemon

      - name: GameTests (servidor Minecraft real)
        run: ./gradlew runGameTest --no-daemon

      - name: Teste de fumaça (mundo real, End gerado)
        run: python3 tools/smoke_test.py

      - uses: actions/upload-artifact@v4
        with:
          name: hollow-horizons
          path: build/libs/*.jar

  client:
    # Abre o cliente real do Minecraft numa tela virtual (Vulkan por software) e salva as screenshots.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Tela virtual e Vulkan por software
        run: sudo apt-get update && sudo apt-get install -y xvfb mesa-vulkan-drivers

      - name: Teste de cliente (jogo real)
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClientGameTest --no-daemon

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gameplay-screenshots
          path: build/run/clientGameTest/build/hollow-horizons-screenshots/
